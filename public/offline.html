<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oink is offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --ink: #0a0a0a; --muted: #5b5f66; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e1014; --ink: #eef0f3; --muted: #9aa0a8; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
      img { width: 96px; height: 96px; }
      button { min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid currentColor; background: none; color: inherit; font: inherit; }
      p { color: var(--muted); max-width: 32ch; margin: 8px auto 20px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Oink needs a connection to show balances and sign anything. Nothing was sent.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
