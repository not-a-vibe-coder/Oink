name: Flow and Bell verification
on:
  push:
    paths:
      [
        "src/**",
        "backend/**",
        "scripts/verify-flow.ts",
        "bun.lock",
        "package.json",
        ".github/workflows/flow-bell.yml",
      ]
  pull_request:
    paths:
      [
        "src/**",
        "backend/**",
        "scripts/verify-flow.ts",
        "bun.lock",
        "package.json",
        ".github/workflows/flow-bell.yml",
      ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: flow-ci-test
          POSTGRES_DB: oink_flow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: backend
      - run: bun run verify:flow
        env:
          TEST_DATABASE_URL: postgresql://postgres:flow-ci-test@127.0.0.1:5432/oink_flow_test
