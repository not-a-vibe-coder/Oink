name: Backend CI/CD

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml", "src/lib/crypto/kdf-params.ts"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml", "src/lib/crypto/kdf-params.ts"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: bun run check
      - run: bun test

  crypto-params:
    name: Assert KDF parameters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Argon2id parameters must match the spec
        run: |
          grep -q 'm: 65536' src/lib/crypto/kdf-params.ts
          grep -q 't: 3'     src/lib/crypto/kdf-params.ts
          grep -q 'p: 1'     src/lib/crypto/kdf-params.ts

  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  release:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release tag
        run: |
          tag="backend-$(date -u +'%Y%m%d%H%M')-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

  deploy:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment when configured
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping deployment."
            exit 0
          fi
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || echo "Render deploy hook failed; continuing."
